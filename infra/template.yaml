AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  WealthPilot - explainable investment simulation (PolyFinances datathon).
  Amazon Bedrock Converse API (Claude Haiku 4.5 + Nova 2 Lite fallback),
  agents and tools in Lambda, data in S3, session state and audit trail in
  DynamoDB. No public endpoint: the UI invokes the function with IAM credentials.

Parameters:
  ModelId:
    Type: String
    Default: global.anthropic.claude-haiku-4-5-20251001-v1:0
  FallbackModelId:
    Type: String
    Default: global.amazon.nova-2-lite-v1:0
  DataPrefix:
    Type: String
    Default: wealthpilot

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: {Status: Enabled}   # data versions stay traceable

  TraceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
      SSESpecification: {SSEEnabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}

  AgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      MemorySize: 2048
      Timeout: 300                     # an agent turn makes several model and tool calls
      ReservedConcurrentExecutions: 5  # caps cost during the datathon
      Environment:
        Variables:
          DATA_BUCKET: !Ref DataBucket
          DATA_PREFIX: !Ref DataPrefix
          TRACE_TABLE: !Ref TraceTable
          WEALTHPILOT_LLM: bedrock
          WEALTHPILOT_MODEL: !Ref ModelId
          WEALTHPILOT_FALLBACK_MODEL: !Ref FallbackModelId
      Policies:
        - S3ReadPolicy: {BucketName: !Ref DataBucket}
        - DynamoDBCrudPolicy: {TableName: !Ref TraceTable}
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: "*"
    Metadata:
      DockerContext: ..
      Dockerfile: infra/Dockerfile

Outputs:
  FunctionName: {Value: !Ref AgentFunction}
  DataBucketName: {Value: !Ref DataBucket}
  TraceTableName: {Value: !Ref TraceTable}
